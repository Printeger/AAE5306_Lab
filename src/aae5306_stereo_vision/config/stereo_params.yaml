  processing:
    detector:
      type: fast # sift / orb for detection & matching # harris / fast for detection
      publish_rate: 10.0
      visualize: true
    matching:
      ratio_threshold: 0.75
      epipolar_threshold: 2.0
      max_delay: 0.1
      max_features: 100
      min_features: 80
      use_ransac: true
      use_flow_back: true
      visualize: true
    depth:
      min_depth: 0.5
      max_depth: 15.0
      min_ray_depth: 3.0   
      max_ray_depth: 12.0  
      max_delay: 0.1
      visualize: true
    tracking:
      max_features: 100
      min_features: 80
      motion_threshold: 1.0
      quality_level: 0.01
      min_distance: 7
      fb_threshold: 1.5
      error_threshold: 20.0
      track_history: 30
      bg_history: 300
      bg_var_threshold: 32.0
  topics:
    inputs:
      cam0: /cam0/image_raw
      cam1: /cam1/image_raw
    outputs:
      feature_detection:
        cam0:
          features_image: /stereo_vision/cam0/features_image
          feature_stats: /stereo_vision/cam0/feature_stats
        cam1:
          features_image: /stereo_vision/cam1/features_image
          feature_stats: /stereo_vision/cam1/feature_stats
      feature_matching:
        matches_image: /stereo_vision/matches_image
        match_stats: /stereo_vision/match_stats
      optical_flow_matching:
        matches_image: /stereo_vision/optical_flow_matches_image
        temporal_tracks_image: /stereo_vision/optical_flow_temporal_tracks_image
        match_stats: /stereo_vision/optical_flow_match_stats
      depth_recovery:
        pointcloud: /stereo_vision/pointcloud
        depth_image: /stereo_vision/depth_image
        depth_stats: /stereo_vision/depth_stats
      video_temporal_tracking:
        frame_image: /stereo_vision/video_frame
        temporal_tracks_image: /stereo_vision/video_temporal_tracks
        track_stats: /stereo_vision/video_track_stats
  frames:
    cam0: cam0
    cam1: cam1
    pointcloud: cam0
  nodes:
    feature_detection_cam0:
      type: feature_detection
      camera: cam0
    feature_detection_cam1:
      type: feature_detection
      camera: cam1
    feature_matching:
      type: feature_matching
      left_camera: cam0
      right_camera: cam1
    optical_flow_matching:
      type: optical_flow_matching
      left_camera: cam0
      right_camera: cam1
    depth_recovery:
      type: depth_recovery
      left_camera: cam0
      right_camera: cam1
    video_temporal_tracking:
      type: video_temporal_tracking
      video_file: /home/cooper/code/ws/AAE5306_Lab/drone_fly_downscale.mp4
      frame_rate: 30
      visualize: true
      loop_video: true
  stereo:
    baseline: 0.110074
